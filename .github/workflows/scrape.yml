name: MOPS 重大公告抓取

on:
  schedule:
    # 台北时间 19:00 = UTC 11:00; 台北 23:00 = UTC 15:00
    # MOPS 公告通常在 18:00~20:00 台北时间发布，确保两个时间点都能抓到数据
    - cron: '0 11 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mops-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: MOPS 端点诊断（临时）
        run: >
          node -e "
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36';
          const H={'User-Agent':UA,'Accept':'application/json, text/plain, */*','Content-Type':'application/json','Origin':'https://mops.twse.com.tw','Referer':'https://mops.twse.com.tw/mops/'};
          const tests=[
            ['GET 首頁','https://mops.twse.com.tw/mops/',{headers:{'User-Agent':UA,Accept:'text/html'},redirect:'follow'}],
            ['POST t05sr01_1','https://mops.twse.com.tw/mops/api/t05sr01_1',{method:'POST',headers:H,body:JSON.stringify({count:'0',marketKind:''})}],
            ['POST home_page/t05sr01_1','https://mops.twse.com.tw/mops/api/home_page/t05sr01_1',{method:'POST',headers:H,body:JSON.stringify({count:'0',marketKind:''})}],
            ['POST t51sb10','https://mops.twse.com.tw/mops/api/t51sb10',{method:'POST',headers:H,body:JSON.stringify({count:'0',marketKind:''})}],
          ];
          (async()=>{ for(const [name,url,opt] of tests){
            try{ const r=await fetch(url,{...opt,signal:AbortSignal.timeout(15000)}); console.log(name,'→ HTTP',r.status); }
            catch(e){ console.log(name,'→ FAIL',e.cause?.code||e.message); }
          }})();"

      - name: 抓取公告并评分
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: https://api.b.ai/v1
          LLM_MODEL: glm-5.3-flash
        run: node scripts/scrape.mjs

      - name: 提交抓取结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "没有数据变更,跳过提交"
          else
            git commit -m "update: 抓取结果 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main || echo "rebase 失败,跳过"
            git push
          fi
