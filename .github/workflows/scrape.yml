name: MOPS 重大公告抓取

on:
  schedule:
    # 台北时间 19:00 = UTC 11:00; 台北 23:00 = UTC 15:00
    # MOPS 公告通常在 18:00~20:00 台北时间发布，确保两个时间点都能抓到数据
    - cron: '0 11 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mops-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Telegram Token 诊断（不显示 Token 本体）
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          node -e '
            const t = (process.env.TELEGRAM_BOT_TOKEN || "").trim();
            console.log("token 长度:", t.length);
            console.log("原始值含空格:", /\s/.test(process.env.TELEGRAM_BOT_TOKEN || ""));
            console.log("原始值含换行:", /[\r\n]/.test(process.env.TELEGRAM_BOT_TOKEN || ""));
            console.log("以 bot 开头:", /^bot/i.test(t));
            console.log("符合标准格式 数字:串:", /^[0-9]{8,10}:[A-Za-z0-9_-]{30,}$/.test(t));
            fetch("https://api.telegram.org/bot" + t + "/getMe")
              .then(r => r.json()).then(j => {
                console.log("getMe 结果:", JSON.stringify(j));
                if (j.ok) console.log("→ Token 有效，bot 用户名: @" + j.result.username);
                else console.log("→ Token 无效，请到 BotFather 重新复制");
              });
          '

      - name: 抓取公告并评分
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/scrape.mjs

      - name: 提交抓取结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "没有数据变更,跳过提交"
          else
            git commit -m "update: 抓取结果 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

  send-notification:
    needs: scrape
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            📋 MOPS 公告抓取完成
            Repository: ${{ github.repository }}
            Job: ${{ needs.scrape.result }}
            Run: ${{ github.run_id }}
            Time: ${{ github.event.head_commit.timestamp || '手动触发' }}
