name: MOPS 重大公告抓取

on:
  schedule:
    # 台北时间 19:00 = UTC 11:00; 台北 23:00 = UTC 15:00
    # MOPS 公告通常在 18:00~20:00 台北时间发布，确保两个时间点都能抓到数据
    - cron: '0 11 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mops-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取公告并评分（失败自动重试：MOPS 会间歇性封锁 runner IP，换 IP 重试即可）
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: https://api.b.ai/v1
          LLM_MODEL: glm-5.3-flash
        run: |
          ok=0
          for i in 1 2 3 4; do
            if node scripts/scrape.mjs; then ok=1; break; fi
            echo "第 $i 次失敗（MOPS 可能封鎖了此 runner 的 IP），等 5 分鐘換環境重試"
            [ "$i" -lt 4 ] && sleep 300
          done
          if [ "$ok" -ne 1 ]; then echo "4 次重試全部失敗"; exit 1; fi

      - name: 提交抓取结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "没有数据变更,跳过提交"
          else
            git commit -m "update: 抓取结果 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main || echo "rebase 失败,跳过"
            git push
          fi
